<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="hsl(30 10% 3%)" />

    <!-- CRITICAL: Apply theme before any paint to prevent flash -->
    <script>
      (function () {
        try {
          var STORAGE_KEY = "theme";
          var stored = localStorage.getItem(STORAGE_KEY);
          // Only accept valid values; default to dark
          var theme = stored === "light" || stored === "dark" ? stored : "dark";
          
          var root = document.documentElement;
          // Single source of truth
          root.dataset.theme = theme;
          // Tailwind compatibility
          root.classList.add(theme);
          
          // Update meta theme-color
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute(
              "content",
              theme === "dark" ? "hsl(30 10% 3%)" : "hsl(42 45% 96%)"
            );
          }

          // Block indexing on Lovable staging domain only
          if (window.location.hostname.endsWith('.lovable.app')) {
            var noindex = document.createElement('meta');
            noindex.name = 'robots';
            noindex.content = 'noindex, nofollow';
            document.head.appendChild(noindex);
          }
        } catch (e) {
          // Fail silently
        }
      })();
    </script>

    <title>Driving Klass | Where 5-Star Drivers Are Made</title>
    <meta name="description" content="Driving Klass — professional driving lessons and road test prep in Carrollton, GA. Where 5-Star Drivers Are Made. Book your lesson today!" />
    <meta name="author" content="Driving Klass" />
    <meta name="keywords" content="driving school, driving lessons, road test, driver education, learn to drive, professional driving instruction" />

    <link rel="canonical" href="https://drivingklass.com" />

    <!-- the opening film's first frame, so the splash paints at once -->

    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/drivingklass-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/drivingklass-512.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/drivingklass-180.png" />
